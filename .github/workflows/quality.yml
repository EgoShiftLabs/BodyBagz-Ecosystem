name: BodyBagz Ecosystem quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and contract tests
        run: npm run quality
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install chromium
      - name: Serve static modules
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/bodybagz-http.log 2>&1 &
          sleep 2
      - name: Exercise real browser interactions
        run: node tests/browser-smoke.mjs
